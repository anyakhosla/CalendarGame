<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cal·Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0ebe0;
  --surface: #faf7f2;
  --border: #cec4ae;
  --border2: #b8ac95;
  --text: #1c1710;
  --muted: #7a7060;
  --cell-bg: #e4ddd0;
  --cell-hover: #d8d0c0;
  --today-bg: #bf3a20;
  --today-text: #fff8f0;
  --gap: 3px;
  --cell: 50px;
  --radius: 5px;
  --shadow: 0 2px 12px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.18);
}

body {
  background: var(--bg);
  font-family: 'DM Mono', monospace;
  color: var(--text);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(200,190,168,0.3) 0%, transparent 50%),
    radial-gradient(circle at 85% 80%, rgba(180,160,130,0.2) 0%, transparent 40%);
}

.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 28px 16px 48px;
}

/* Header */
.header { text-align: center; }
.title {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
}
.subtitle {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 5px;
}

.date-badge {
  font-size: 12px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 16px;
  box-shadow: var(--shadow);
}

/* Board */
.board-wrap { position: relative; }
.board {
  display: grid;
  grid-template-columns: repeat(7, var(--cell));
  grid-template-rows: repeat(7, var(--cell));
  gap: var(--gap);
  background: var(--border2);
  border: var(--gap) solid var(--border2);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  user-select: none;
  touch-action: none;
}

.cell {
  width: var(--cell);
  height: var(--cell);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius);
  background: var(--cell-bg);
  color: var(--text);
  position: relative;
  transition: filter 0.1s, transform 0.1s;
}
.cell.void { background: var(--bg); pointer-events: none; }
.cell.today { background: var(--today-bg) !important; color: var(--today-text) !important; font-weight: 700; }
.cell.drop-target { transform: scale(1.05); z-index: 2; }
.cell.drop-invalid { animation: shake 0.25s ease; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
@keyframes plop {
  0% { transform: scale(1.08); }
  60% { transform: scale(0.97); }
  100% { transform: scale(1); }
}
.cell.just-placed { animation: plop 0.25s ease forwards; }

/* Drag ghost */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.85;
  transform: scale(1.1);
  transition: none;
}
.drag-ghost .piece-grid-ghost { display: grid; gap: 3px; }
.drag-ghost .pc-ghost {
  border-radius: 4px;
}

/* Controls */
.controls {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 7px 15px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s, transform 0.08s, box-shadow 0.12s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  touch-action: manipulation;
}
.btn:hover { background: var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.btn:active { transform: scale(0.96); }
.btn.primary { background: #2b4a3c; color: #b8e0c4; border-color: #2b4a3c; }
.btn.primary:hover { background: #1e3629; }
.btn.danger { background: var(--today-bg); color: #fff; border-color: var(--today-bg); }
.btn.danger:hover { background: #a83018; }
.btn:disabled { opacity: 0.3; pointer-events: none; }

/* Hint bar */
.hint-bar {
  font-size: 11px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 16px;
  min-height: 28px;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 380px;
  text-align: center;
  justify-content: center;
}

/* Tray */
.tray-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.tray {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  max-width: 440px;
  box-shadow: var(--shadow);
  user-select: none;
}

.piece-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px;
  border-radius: 10px;
  border: 1.5px solid transparent;
  cursor: grab;
  transition: background 0.12s, transform 0.12s, opacity 0.2s, border-color 0.12s;
  position: relative;
  touch-action: none;
}
.piece-wrap:hover:not(.used) {
  background: var(--bg);
  border-color: var(--border);
  transform: translateY(-2px);
}
.piece-wrap:active:not(.used) { cursor: grabbing; }
.piece-wrap.used {
  opacity: 0.18;
  pointer-events: none;
}
.piece-wrap.dragging { opacity: 0.3; transform: scale(0.92); }
.piece-wrap.selected { background: var(--bg); border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 0 0 2px var(--border2); }
.piece-grid { display: grid; gap: 3px; }
.pc { width: 22px; height: 22px; border-radius: 4px; }
.pc.off { background: transparent !important; }
.piece-name { font-size: 9px; color: var(--muted); }

/* Right-click context (rotate/flip) */
.ctx-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 4px;
  box-shadow: var(--shadow-lg);
  z-index: 999;
  display: none;
  flex-direction: column;
  gap: 2px;
  min-width: 130px;
}
.ctx-menu.show { display: flex; }
.ctx-item {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  background: none;
  text-align: left;
  color: var(--text);
  transition: background 0.1s;
}
.ctx-item:hover { background: var(--bg); }
.ctx-divider { height: 1px; background: var(--border); margin: 2px 8px; }

/* Status */
.status {
  font-size: 11px;
  color: var(--muted);
  min-height: 16px;
  text-align: center;
  font-style: italic;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20,15,8,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
  backdrop-filter: blur(3px);
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px;
  max-width: 360px;
  width: 92%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: var(--shadow-lg);
  animation: modal-in 0.22s ease;
}
@keyframes modal-in { from { transform: scale(0.94) translateY(8px); } to { transform: scale(1) translateY(0); } }
.modal-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
.share-text {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  line-height: 1.65;
  white-space: pre;
  overflow-x: auto;
}
.stats-grid { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.stat-box { background: var(--bg); border-radius: 8px; padding: 10px; text-align: center; }
.stat-num { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; }
.stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }
.personality-card { background: var(--bg); border-radius: 10px; padding: 14px 16px; text-align: center; }
.personality-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
.personality-line { font-size: 11px; color: var(--muted); margin-top: 4px; }
.mini-board { display: grid; grid-template-columns: repeat(7, 14px); gap: 2px; }
.mini-cell { width: 14px; height: 14px; border-radius: 2px; }
.flavor-line { font-size: 11px; color: var(--muted); text-align: center; }

/* Mobile */
@media (max-width: 430px) {
  :root { --cell: 42px; }
  .app { padding: 20px 8px 36px; }
}

/* Progress dots */
.progress-row {
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}
.prog-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s;
}
.prog-dot.done { background: #2b4a3c; }

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">Cal·Puzzle</div>
    <div class="subtitle">Cover every cell — leave today exposed</div>
  </div>

  <div class="date-badge" id="dateDisplay"></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="tray-label">Pieces</div>
  <div class="tray" id="tray"></div>

  <div class="controls">
    <button class="btn" id="btnRotate" onclick="rotatePiece()" disabled>↻ Rotate (R)</button>
    <button class="btn" id="btnFlip" onclick="flipPiece()" disabled>⇄ Flip (F)</button>
    <button class="btn danger" onclick="clearBoard()">Reset</button>
    <button class="btn primary" onclick="checkWin()">Check ↗</button>
  </div>

  <div class="hint-bar" id="hintBar">Drag pieces from the tray onto the board · Right-click a piece to rotate/flip</div>

  <div class="progress-row" id="progressRow"></div>
  <div class="status" id="status"></div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu">
  <button class="ctx-item" onclick="ctxRotate()">↻ Rotate 90°</button>
  <button class="ctx-item" onclick="ctxFlip()">⇄ Flip</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item" onclick="ctxLift()">↑ Pick up from board</button>
  <div class="ctx-divider"></div>
  <button class="ctx-item" onclick="closeCtx()">✕ Cancel</button>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div id="miniBoardWrap" style="display:flex;justify-content:center;margin:4px 0"></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="share-text" id="shareText" style="display:none"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" onclick="copyShare()">Copy to clipboard</button>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
// ── Date ─────────────────────────────────────────────────────
const today = new Date();
const todayMonth = today.getMonth();
const todayDate  = today.getDate();
const monthsFull  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthsShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('dateDisplay').textContent = `${monthsFull[todayMonth]} ${todayDate}, ${today.getFullYear()}`;

const ROWS = 7, COLS = 7;

// ── Board definition ─────────────────────────────────────────
function buildCellDefs() {
  const d = [];
  for (let m = 0; m < 6; m++)  d.push({ type:'month', month:m });
  d.push({ type:'void' });
  for (let m = 6; m < 12; m++) d.push({ type:'month', month:m });
  d.push({ type:'void' });
  for (let n = 1; n <= 28; n++) d.push({ type:'day', day:n });
  d.push({ type:'void' }, { type:'void' });
  d.push({ type:'day', day:29 }, { type:'day', day:30 }, { type:'day', day:31 });
  d.push({ type:'void' }, { type:'void' });
  return d;
}
const cellDefs = buildCellDefs();

function getTodayCells() {
  const out = [];
  cellDefs.forEach((c,i) => {
    if (c.type==='month' && c.month===todayMonth) out.push(i);
    if (c.type==='day'   && c.day===todayDate)    out.push(i);
  });
  return out;
}
const todayCells = getTodayCells();
const coverage = new Array(COLS * ROWS).fill(-1);

// ── Stat tracking ─────────────────────────────────────────────
const stats = { rotations:0, flips:0, resets:0, repositions:0, badDrops:0, startTime: Date.now(), endTime: null, pieceAttempts: new Array(9).fill(0) };
let modalData = null; // snapshot stored when win modal opens, used for canvas copy

// ── Piece definitions ─────────────────────────────────────────
const PIECE_COLORS = ['#7B6FA0','#4a8fa8','#c87941','#6b9e5e','#b85470','#4a6e9e','#9e6b4a','#7a9e4a','#9e4a7a'];
const PIECE_LIGHT  = ['#c5bfe6','#aad4e4','#f0c898','#b4d4ac','#e4a8bc','#a8bcda','#d4b89c','#c4da94','#d4a4c4'];
const EMOJI_MAP    = ['🔴','🟠','🟡','🟢','🔵','🟣','🟤','⚫','⚪'];

const PIECES_BASE = [
  { name:'Square',  cells:[[0,0],[0,1],[1,0],[1,1]] },
  { name:'L3',      cells:[[0,0],[1,0],[2,0],[2,1]] },
  { name:'L4',      cells:[[0,0],[1,0],[2,0],[3,0],[3,1]] },
  { name:'Plus',    cells:[[0,1],[1,0],[1,1],[1,2],[2,1]] },
  { name:'Half+',   cells:[[0,1],[1,0],[1,1],[2,1]] },
  { name:'Sq+1',    cells:[[0,0],[0,1],[1,0],[1,1],[2,0]] },
  { name:'C',       cells:[[0,0],[0,1],[1,0],[2,0],[2,1]] },
  { name:'Z5',      cells:[[0,1],[0,2],[1,1],[2,0],[2,1]] },
  { name:'Z4',      cells:[[0,1],[0,2],[1,0],[1,1]] },
];

let pieces = PIECES_BASE.map((p,i) => ({
  ...p, id:i,
  color: PIECE_COLORS[i], colorLight: PIECE_LIGHT[i],
  rotation:0, flipped:false, used:false,
  cells: p.cells.map(c=>[...c])
}));

// ── Transform helpers ─────────────────────────────────────────
function rotateCells90(cells) {
  const r = cells.map(([r,c])=>[c,-r]);
  const minR=Math.min(...r.map(([r])=>r)), minC=Math.min(...r.map(([,c])=>c));
  return r.map(([r,c])=>[r-minR,c-minC]);
}
function flipCellsH(cells) {
  const maxC=Math.max(...cells.map(([,c])=>c));
  return cells.map(([r,c])=>[r,maxC-c]);
}
function normalize(cells) {
  const minR=Math.min(...cells.map(([r])=>r)), minC=Math.min(...cells.map(([,c])=>c));
  return cells.map(([r,c])=>[r-minR,c-minC]);
}
function getPieceCells(piece) {
  let cells = piece.cells.map(c=>[...c]);
  if (piece.flipped) cells = flipCellsH(cells);
  for (let i=0;i<piece.rotation;i++) cells=rotateCells90(cells);
  return normalize(cells);
}

// ── Coverage helpers ──────────────────────────────────────────
function liftPiece(pieceId) {
  for (let i=0;i<coverage.length;i++) if (coverage[i]===pieceId) coverage[i]=-1;
  pieces[pieceId].used = false;
}
function getAbsCells(aR, aC, piece) {
  return getPieceCells(piece).map(([dr,dc])=>(aR+dr)*COLS+(aC+dc));
}
function isValid(aR, aC, piece) {
  for (const [dr,dc] of getPieceCells(piece)) {
    const r=aR+dr, c=aC+dc;
    if (r<0||r>=ROWS||c<0||c>=COLS) return false;
    const idx=r*COLS+c;
    if (cellDefs[idx].type==='void') return false;
    if (todayCells.includes(idx)) return false;
    if (coverage[idx]!==-1) return false;
  }
  return true;
}

// ── Drag & Drop state ─────────────────────────────────────────
let dragPiece = null;          // piece being dragged
let selectedPiece = null;      // piece clicked (not yet dragging) — R/F target
let dragFromBoard = false;     // was it lifted from the board?
let isDragging = false;        // true once mouse moves enough after mousedown
let dragGhost = null;          // ghost el
let dragOffsetR = 0;           // which cell of the piece the user grabbed
let dragOffsetC = 0;
let currentHoverIdx = null;
let pendingBoardDrag = null;   // { startX, startY, idx } — waiting for threshold
let pendingTrayDrag  = null;   // { startX, startY, pieceId, wrap } — waiting for threshold

// Piece dimensions for centering ghost
function getPieceDims(piece) {
  const cells = getPieceCells(piece);
  const maxR = Math.max(...cells.map(([r])=>r));
  const maxC = Math.max(...cells.map(([,c])=>c));
  return { rows: maxR+1, cols: maxC+1 };
}

function createGhost(piece) {
  const el = document.createElement('div');
  el.className = 'drag-ghost';
  const cells = getPieceCells(piece);
  const { rows, cols } = getPieceDims(piece);
  const set = new Set(cells.map(([r,c])=>`${r},${c}`));
  const GSIZ = 26;
  const grid = document.createElement('div');
  grid.className = 'piece-grid-ghost';
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, ${GSIZ}px)`;
  grid.style.gridTemplateRows = `repeat(${rows}, ${GSIZ}px)`;
  grid.style.gap = '3px';
  for (let r=0; r<rows; r++) for (let c=0; c<cols; c++) {
    const pc = document.createElement('div');
    pc.className = 'pc-ghost';
    pc.style.width = GSIZ+'px';
    pc.style.height = GSIZ+'px';
    pc.style.borderRadius = '4px';
    pc.style.background = set.has(`${r},${c}`) ? piece.color : 'transparent';
    grid.appendChild(pc);
  }
  el.appendChild(grid);
  document.body.appendChild(el);
  return el;
}

function moveGhost(e) {
  if (!dragGhost) return;
  const { cols } = getPieceDims(dragPiece);
  const GSIZ = 26, GAP = 3;
  const totalW = cols*(GSIZ+GAP)-GAP;
  dragGhost.style.left = (e.clientX - totalW/2) + 'px';
  dragGhost.style.top  = (e.clientY - 30) + 'px';
}

function removeGhost() {
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
}

// ── Drag thresholds (board + tray) ────────────────────────────
const DRAG_THRESHOLD = 5;

function onBoardPendingMove(e) {
  if (!pendingBoardDrag) return;
  if (e.cancelable) e.preventDefault();
  const dx = e.clientX - pendingBoardDrag.startX;
  const dy = e.clientY - pendingBoardDrag.startY;
  if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
    const idx = pendingBoardDrag.idx;
    cleanupBoardPending();
    startBoardDrag(e, idx);
  }
}
function onBoardPendingUp() {
  if (!pendingBoardDrag) { cleanupBoardPending(); return; }
  const { idx } = pendingBoardDrag;
  cleanupBoardPending();
  const pieceId = coverage[idx];
  if (pieceId !== -1) {
    liftPiece(pieceId);
    stats.repositions++;
    renderBoard(); renderTray(); updateBtns();
    setStatus(`${pieces[pieceId].name} returned to tray.`);
  }
}
function cleanupBoardPending() {
  pendingBoardDrag = null;
  document.removeEventListener('pointermove', onBoardPendingMove);
  document.removeEventListener('pointerup', onBoardPendingUp);
}

function onTrayPendingMove(e) {
  if (!pendingTrayDrag) return;
  if (e.cancelable) e.preventDefault();
  const dx = e.clientX - pendingTrayDrag.startX;
  const dy = e.clientY - pendingTrayDrag.startY;
  if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
    const { pieceId, wrap } = pendingTrayDrag;
    cleanupTrayPending();
    startTrayDrag(e, pieceId, wrap);
  }
}
function onTrayPendingUp() { cleanupTrayPending(); }
function cleanupTrayPending() {
  pendingTrayDrag = null;
  document.removeEventListener('pointermove', onTrayPendingMove);
  document.removeEventListener('pointerup', onTrayPendingUp);
}

// ── Anchor calculation ────────────────────────────────────────
// Compute (row, col) anchor adjusted so the piece's visual center aligns with
// the hovered cell, matching the ghost which is horizontally centered and 30px
// above the cursor.
function getAnchorRC(hoverIdx) {
  const hR = Math.floor(hoverIdx / COLS);
  const hC = hoverIdx % COLS;
  if (!dragPiece) return [hR, hC];
  const GSIZ = 26, GAP = 3;
  const { cols } = getPieceDims(dragPiece);
  const totalW = cols * (GSIZ + GAP) - GAP;
  const dC = Math.round((totalW / 2) / (GSIZ + GAP));
  const dR = Math.round(30 / (GSIZ + GAP));
  return [hR - dR, hC - dC];
}

// ── Drag from tray ────────────────────────────────────────────
function startTrayDrag(e, pieceId, wrapEl) {
  cleanupBoardPending();
  cleanupTrayPending();
  isDragging = true;
  dragPiece = pieces[pieceId];
  selectedPiece = dragPiece;
  dragGhost = createGhost(dragPiece);
  moveGhost(e);
  const wrap = wrapEl ?? e.currentTarget;
  if (wrap) wrap.classList.add('dragging');
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  setHint(`Dragging ${dragPiece.name} — drop on board · R rotate · F flip`);
}

// ── Drag from board (lift) ────────────────────────────────────
function startBoardDrag(e, idx) {
  const pieceId = coverage[idx];
  if (pieceId === -1) return;
  e.preventDefault();
  e.stopPropagation();
  isDragging = true;
  liftPiece(pieceId);
  dragPiece = pieces[pieceId];
  dragFromBoard = true;
  stats.repositions++;
  dragGhost = createGhost(dragPiece);
  moveGhost(e);
  renderBoard();
  renderTray();
  updateBtns();
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  setHint(`Moving ${dragPiece.name} — R to rotate, F to flip`);
}

// Math-based hover — works over void cells and adapts to responsive --cell size
function cellIdxFromPoint(clientX, clientY) {
  const board = document.getElementById('board');
  const rect = board.getBoundingClientRect();
  const GAP = 3;
  const CELL = (rect.width - GAP * 8) / 7; // derived from actual board width
  const col = Math.floor((clientX - rect.left - GAP) / (CELL + GAP));
  const row = Math.floor((clientY - rect.top  - GAP) / (CELL + GAP));
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return null;
  return row * COLS + col;
}

function onDragMove(e) {
  if (e.cancelable) e.preventDefault(); // prevent page scroll on touch
  moveGhost(e);
  const idx = cellIdxFromPoint(e.clientX, e.clientY);
  if (idx !== currentHoverIdx) {
    clearPreview();
    currentHoverIdx = idx;
    if (currentHoverIdx !== null) showPreview(currentHoverIdx);
  }
}

function onDragEnd(e) {
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  clearPreview();
  removeGhost();
  isDragging = false;

  document.querySelectorAll('.piece-wrap.dragging').forEach(el=>el.classList.remove('dragging'));

  if (!dragPiece) return;
  const idx = cellIdxFromPoint(e.clientX, e.clientY);

  if (idx !== null) {
    placePiece(idx);
  } else {
    dragPiece.used = false;
    setStatus('Piece returned to tray.');
  }
  dragPiece = null;
  currentHoverIdx = null;
  renderBoard(); renderTray(); updateBtns();
}

function placePiece(hoverIdx) {
  const [aR, aC] = getAnchorRC(hoverIdx);
  stats.pieceAttempts[dragPiece.id]++;
  if (!isValid(aR, aC, dragPiece)) {
    flashInvalid(aR, aC);
    dragPiece.used = false;
    stats.badDrops++;
    setStatus('That spot is blocked — try rotating or a different position.');
    return;
  }
  getAbsCells(aR, aC, dragPiece).forEach(i=>{ coverage[i]=dragPiece.id; });
  dragPiece.used = true;
  const placed = dragPiece;
  selectedPiece = null;
  const rem = pieces.filter(p=>!p.used).length;
  // plop animation
  requestAnimationFrame(()=>{
    const board = document.getElementById('board');
    getAbsCells(aR, aC, placed).forEach(i=>{
      if (board.children[i]) {
        board.children[i].classList.add('just-placed');
        setTimeout(()=>board.children[i]?.classList.remove('just-placed'), 300);
      }
    });
  });
  if (rem===0) setTimeout(checkWin, 300);
  else setStatus(`${placed.name} placed! ${rem} piece${rem!==1?'s':''} left.`);
  updateProgress();
}

function flashInvalid(aR, aC) {
  const board = document.getElementById('board');
  if (dragPiece) {
    for (const [dr,dc] of getPieceCells(dragPiece)) {
      const r=aR+dr, c=aC+dc;
      if (r<0||r>=ROWS||c<0||c>=COLS) continue;
      const i=r*COLS+c;
      if (board.children[i]) {
        board.children[i].classList.add('drop-invalid');
        setTimeout(()=>board.children[i]?.classList.remove('drop-invalid'), 300);
      }
    }
  }
}

// ── Preview ───────────────────────────────────────────────────
function showPreview(hoverIdx) {
  if (!dragPiece) return;
  const [aR, aC] = getAnchorRC(hoverIdx);
  const valid = isValid(aR, aC, dragPiece);
  const board=document.getElementById('board');
  for (const [dr,dc] of getPieceCells(dragPiece)) {
    const r=aR+dr, c=aC+dc;
    if (r<0||r>=ROWS||c<0||c>=COLS) continue;
    const idx=r*COLS+c;
    const el=board.children[idx];
    if (!el||cellDefs[idx].type==='void') continue;
    el.style.outline=`2.5px solid ${valid ? dragPiece.color : '#bf3a20'}`;
    el.style.outlineOffset='-2px';
    if (valid && coverage[idx]===-1 && !todayCells.includes(idx)) {
      el.style.background=dragPiece.color+'bb';
      el.style.color=dragPiece.colorLight;
    }
    if (valid) el.classList.add('drop-target');
  }
}
function clearPreview() {
  const board=document.getElementById('board');
  for (const el of board.children) {
    el.style.outline='';
    el.style.outlineOffset='';
    el.classList.remove('drop-target');
    const idx=parseInt(el.dataset.idx);
    if (!isNaN(idx) && coverage[idx]===-1 && !todayCells.includes(idx)) {
      el.style.background='';
      el.style.color='';
    }
  }
}

// ── Board render ──────────────────────────────────────────────
function renderBoard() {
  const board=document.getElementById('board');
  board.innerHTML='';
  for (let i=0;i<ROWS*COLS;i++) {
    const def=cellDefs[i];
    const div=document.createElement('div');
    div.className='cell';
    div.dataset.idx=i;
    if (def.type==='void') {
      div.classList.add('void');
    } else {
      div.textContent = def.type==='month' ? monthsShort[def.month] : def.day;
    }
    if (todayCells.includes(i)) {
      div.classList.add('today');
    } else if (coverage[i]!==-1) {
      const p=pieces[coverage[i]];
      div.style.background=p.color;
      div.style.color=p.colorLight;
      // Allow drag-to-lift from board (threshold prevents accidental drags on click)
      div.addEventListener('pointerdown', (e)=>{
        if (e.button !== 0) return;
        e.preventDefault();
        pendingBoardDrag = { startX: e.clientX, startY: e.clientY, idx: i };
        document.addEventListener('pointermove', onBoardPendingMove);
        document.addEventListener('pointerup', onBoardPendingUp);
      });
      div.addEventListener('contextmenu', (e)=>{
        e.preventDefault();
        openCtxBoard(e, coverage[i]);
      });
      div.style.cursor='grab';
    }
    board.appendChild(div);
  }
}

// ── Tray render ───────────────────────────────────────────────
function makePieceGridEl(piece, size=22) {
  const cells=getPieceCells(piece);
  const maxR=Math.max(...cells.map(([r])=>r));
  const maxC=Math.max(...cells.map(([,c])=>c));
  const set=new Set(cells.map(([r,c])=>`${r},${c}`));
  const grid=document.createElement('div');
  grid.className='piece-grid';
  grid.style.gridTemplateColumns=`repeat(${maxC+1},${size}px)`;
  grid.style.gridTemplateRows=`repeat(${maxR+1},${size}px)`;
  for (let r=0;r<=maxR;r++) for (let c=0;c<=maxC;c++) {
    const pc=document.createElement('div');
    pc.className='pc'+(set.has(`${r},${c}`)?' on':' off');
    pc.style.width=size+'px'; pc.style.height=size+'px';
    if (set.has(`${r},${c}`)) pc.style.background=piece.color;
    grid.appendChild(pc);
  }
  return grid;
}

function renderTray() {
  const tray=document.getElementById('tray');
  tray.innerHTML='';
  pieces.forEach(piece=>{
    const wrap=document.createElement('div');
    wrap.className='piece-wrap'+(piece.used?' used':'')+(selectedPiece?.id===piece.id?' selected':'');
    wrap.appendChild(makePieceGridEl(piece));
    const lbl=document.createElement('div');
    lbl.className='piece-name'; lbl.textContent=piece.name;
    wrap.appendChild(lbl);
    if (!piece.used) {
      wrap.addEventListener('click', (e)=>{
        // click without drag movement = select
        if (!isDragging) {
          selectedPiece = (selectedPiece?.id === piece.id) ? null : piece;
          renderTray(); updateBtns();
          setHint(selectedPiece
            ? `${selectedPiece.name} selected — R rotate · F flip · drag to place`
            : 'Drag pieces from the tray onto the board · Right-click to rotate/flip');
        }
      });
      wrap.addEventListener('pointerdown', (e)=>{
        if (e.button !== 0) return;
        pendingTrayDrag = { startX: e.clientX, startY: e.clientY, pieceId: piece.id, wrap };
        document.addEventListener('pointermove', onTrayPendingMove);
        document.addEventListener('pointerup', onTrayPendingUp);
      });
      wrap.addEventListener('contextmenu', (e)=>{ e.preventDefault(); openCtxTray(e, piece.id); });
    }
    tray.appendChild(wrap);
  });
}

// ── Context menu ──────────────────────────────────────────────
let ctxPieceId = null;
let ctxIsBoard = false;

function openCtxTray(e, pieceId) {
  ctxPieceId = pieceId; ctxIsBoard = false;
  const menu = document.getElementById('ctxMenu');
  document.querySelector('.ctx-item:last-of-type').previousElementSibling.style.display='none'; // hide lift
  document.querySelectorAll('.ctx-divider')[1].style.display='none';
  menu.style.left = Math.min(e.clientX, window.innerWidth-160)+'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight-120)+'px';
  menu.classList.add('show');
}
function openCtxBoard(e, pieceId) {
  ctxPieceId = pieceId; ctxIsBoard = true;
  const menu = document.getElementById('ctxMenu');
  const items = menu.querySelectorAll('.ctx-item');
  items[2].style.display=''; // lift
  menu.querySelectorAll('.ctx-divider')[1].style.display='';
  menu.style.left = Math.min(e.clientX, window.innerWidth-160)+'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight-120)+'px';
  menu.classList.add('show');
}
function closeCtx() { document.getElementById('ctxMenu').classList.remove('show'); ctxPieceId=null; }
function ctxRotate() {
  if (ctxPieceId===null) return;
  pieces[ctxPieceId].rotation=(pieces[ctxPieceId].rotation+1)%4;
  // If on board, lift + put back at same anchor (complex) — just lift
  if (ctxIsBoard) { liftPiece(ctxPieceId); renderBoard(); }
  renderTray(); closeCtx();
  setStatus(`${pieces[ctxPieceId].name} rotated — drag it back onto the board.`);
}
function ctxFlip() {
  if (ctxPieceId===null) return;
  pieces[ctxPieceId].flipped=!pieces[ctxPieceId].flipped;
  if (ctxIsBoard) { liftPiece(ctxPieceId); renderBoard(); }
  renderTray(); closeCtx();
  setStatus(`${pieces[ctxPieceId].name} flipped — drag it back onto the board.`);
}
function ctxLift() {
  if (ctxPieceId===null) return;
  liftPiece(ctxPieceId);
  renderBoard(); renderTray(); closeCtx();
  setStatus(`${pieces[ctxPieceId].name} lifted — drag it back onto the board.`);
}

document.addEventListener('click', (e)=>{
  if (!e.target.closest('#ctxMenu')) closeCtx();
});

// ── Rotate/Flip active drag ───────────────────────────────────
function rotatePiece() {
  const target = dragPiece || selectedPiece;
  if (!target) return;
  target.rotation=(target.rotation+1)%4;
  stats.rotations++;
  if (dragGhost) { removeGhost(); dragGhost = createGhost(target); }
  clearPreview();
  if (currentHoverIdx!==null) showPreview(currentHoverIdx);
  renderTray();
}
function flipPiece() {
  const target = dragPiece || selectedPiece;
  if (!target) return;
  target.flipped=!target.flipped;
  stats.flips++;
  if (dragGhost) { removeGhost(); dragGhost = createGhost(target); }
  clearPreview();
  if (currentHoverIdx!==null) showPreview(currentHoverIdx);
  renderTray();
}

function updateBtns() {
  const active = !!(dragPiece || selectedPiece);
  ['btnRotate','btnFlip'].forEach(id=>document.getElementById(id).disabled=!active);
}

// ── Progress dots ─────────────────────────────────────────────
function updateProgress() {
  const row = document.getElementById('progressRow');
  row.innerHTML='';
  pieces.forEach(p=>{
    const d=document.createElement('div');
    d.className='prog-dot'+(p.used?' done':'');
    d.style.background=p.used?p.color:'';
    row.appendChild(d);
  });
}

// ── Utils ─────────────────────────────────────────────────────
function clearBoard() {
  coverage.fill(-1);
  pieces.forEach(p=>{ p.used=false; p.rotation=0; p.flipped=false; });
  dragPiece=null; selectedPiece=null; removeGhost();
  stats.resets++; stats.rotations=0; stats.flips=0; stats.repositions=0; stats.badDrops=0; stats.startTime=Date.now(); stats.endTime=null; stats.pieceAttempts.fill(0);
  renderBoard(); renderTray(); updateBtns(); updateProgress();
  setStatus('Board cleared — good luck!');
  setHint('Drag pieces from the tray onto the board · Right-click to rotate/flip');
}
function setStatus(msg) { document.getElementById('status').textContent=msg; }
function setHint(msg) { document.getElementById('hintBar').textContent=msg; }

// ── Win/Share helpers ─────────────────────────────────────────
function getPersonality(elapsed) {
  const tweaks = stats.rotations + stats.flips;
  const totalInteractions = tweaks + stats.repositions + stats.badDrops + 9;
  const timePerAction = elapsed / totalInteractions;
  if (elapsed < 120 && stats.resets === 0)                                       return { name:'The Speedrunner',    line:'finished before others even started' };
  if (stats.repositions <= 3 && stats.resets === 0)                             return { name:'The Mastermind',     line:'saw the whole solution from the start' };
  if (stats.repositions > 20 || (stats.resets >= 1 && stats.repositions > 12))   return { name:'The Chaotic Genius', line:'brilliant chaos, and it worked' };
  if (tweaks > 20)                                                                return { name:'The Spinner',        line:'spun every piece into place' };
  if (timePerAction > 20)                                                          return { name:'The Thinker',        line:'thought it through, move by move' };
  return                                                                                 { name:'The Champion',       line:'got it done' };
}

function buildMiniBoard() {
  const grid = document.createElement('div');
  grid.className = 'mini-board';
  for (let i = 0; i < ROWS * COLS; i++) {
    const def = cellDefs[i];
    const mc = document.createElement('div');
    mc.className = 'mini-cell';
    if (def.type === 'void')          mc.style.background = 'transparent';
    else if (todayCells.includes(i))  mc.style.background = 'var(--today-bg)';
    else if (coverage[i] !== -1)      mc.style.background = pieces[coverage[i]].color;
    else                              mc.style.background = 'var(--cell-bg)';
    grid.appendChild(mc);
  }
  return grid;
}

function getRecipeLine() {
  const parts = [];
  if (stats.resets > 0)       parts.push(`${stats.resets} reset${stats.resets !== 1 ? 's' : ''}`);
  const tweaks = stats.rotations + stats.flips;
  if (tweaks > 0)             parts.push(`${tweaks} rotation${tweaks !== 1 ? 's' : ''}`);
  if (stats.repositions > 0)  parts.push(`${stats.repositions} reposition${stats.repositions !== 1 ? 's' : ''}`);
  return parts.length > 0 ? parts.join(' · ') : null;
}

function getNemesisPiece() {
  const max = Math.max(...stats.pieceAttempts);
  if (max < 7) return null;
  return pieces[stats.pieceAttempts.indexOf(max)].name;
}

// ── Win/Share ─────────────────────────────────────────────────
function checkWin() {
  const coverable = cellDefs.filter((d,i) => d.type !== 'void' && !todayCells.includes(i)).length;
  const covered   = coverage.filter((v,i) => v !== -1 && cellDefs[i].type !== 'void').length;
  const piecesUsed = pieces.filter(p => p.used).length;
  const solved = covered === coverable && piecesUsed === pieces.length;

  if (solved && !stats.endTime) stats.endTime = Date.now();
  const elapsed = Math.floor(((stats.endTime || Date.now()) - stats.startTime) / 1000);
  const mins = Math.floor(elapsed / 60), secs = elapsed % 60;
  const timeStr = mins > 0 ? `${mins}:${secs < 10 ? '0' : ''}${secs}` : `${secs}s`;
  const dateStr = `${monthsFull[todayMonth]} ${todayDate}, ${today.getFullYear()}`;

  document.getElementById('miniBoardWrap').innerHTML = '';
  document.getElementById('miniBoardWrap').appendChild(buildMiniBoard());

  if (solved) {
    const p = getPersonality(elapsed);
    const recipe = getRecipeLine();
    const nemesis = getNemesisPiece();
    modalData = { elapsed, personality: p, timeStr, dateStr };
    document.getElementById('modalTitle').textContent = 'Puzzle solved!';
    document.getElementById('statsGrid').innerHTML = `
      <div class="personality-card">
        <div class="personality-name">${p.name}</div>
        <div class="personality-line">${p.line}</div>
      </div>
      <div class="stat-box"><div class="stat-num">${timeStr}</div><div class="stat-lbl">Time</div></div>
      ${recipe ? `<div class="flavor-line">${recipe}</div>` : ''}
      ${nemesis ? `<div class="flavor-line" style="font-style:italic">nemesis: ${nemesis}</div>` : ''}`;
    const shareLines = [`Cal·Puzzle · ${dateStr}`, `${p.name} · ${timeStr}`];
    if (recipe) shareLines.push(recipe);
    if (nemesis) shareLines.push(`nemesis: ${nemesis}`);
    shareLines.push('https://anyakhosla.github.io/CalendarGame/');
    document.getElementById('shareText').textContent = shareLines.join('\n');
  } else {
    document.getElementById('modalTitle').textContent = `In progress — ${covered}/${coverable}`;
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-box"><div class="stat-num">${covered}/${coverable}</div><div class="stat-lbl">Cells covered</div></div>
      <div class="stat-box"><div class="stat-num">${timeStr}</div><div class="stat-lbl">Time</div></div>`;
    document.getElementById('shareText').textContent = `Cal·Puzzle · ${dateStr}\n${covered}/${coverable} cells · ${timeStr}\nhttps://anyakhosla.github.io/CalendarGame/`;
  }

  document.getElementById('modal').classList.add('show');
}
function copyShare() {
  const d = modalData || { personality: { name: '' }, timeStr: '—', dateStr: '' };
  const recipe = getRecipeLine();
  let grid = '';
  for (let r = 0; r < ROWS; r++) {
    let line = '';
    for (let c = 0; c < COLS; c++) {
      const idx = r * COLS + c;
      if (cellDefs[idx].type === 'void')  { line += '⬛'; continue; }
      if (todayCells.includes(idx))       { line += '🟥'; continue; }
      line += coverage[idx] !== -1 ? EMOJI_MAP[coverage[idx]] : '⬜';
    }
    grid += line.replace(/⬛+$/, '') + '\n';
  }
  const lines = [`Cal·Puzzle · ${d.dateStr}`, `${d.personality.name} · ${d.timeStr}`, '', grid.trimEnd(), '', 'https://anyakhosla.github.io/CalendarGame/'];
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    setStatus('Copied! Share it 🎉'); closeModal();
  });
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ── Keyboard ──────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if (e.key==='r'||e.key==='R') rotatePiece();
  if (e.key==='f'||e.key==='F') flipPiece();
  if (e.key==='Escape') { dragPiece=null; selectedPiece=null; removeGhost(); clearPreview(); renderBoard(); renderTray(); updateBtns(); }
});
document.getElementById('modal').addEventListener('click', e=>{
  if (e.target===document.getElementById('modal')) closeModal();
});

// ── Init ──────────────────────────────────────────────────────
renderBoard(); renderTray(); updateBtns(); updateProgress();
setStatus(`Cover every cell except ${monthsFull[todayMonth]} and ${todayDate}.`);
</script>
</body>
